<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Network & Diagnostic Dashboard</title>
  <style>
    /* Dark-mode layout tailored for mobile phone screens */
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888888;
      margin-bottom: 20px;
    }

    /* Card styling to group network metrics cleanly */
    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }

    .card-title {
      font-size: 0.85rem;
      color: #aaaaaa;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .card-value {
      font-size: 1.4rem;
      font-weight: bold;
      color: #00e676; /* Accent green color */
      word-break: break-all;
    }

    .sub-text {
      font-size: 0.85rem;
      color: #cccccc;
      margin-top: 4px;
    }

    /* Action button to trigger page refresh */
    button {
      background-color: #00e676;
      color: #121212;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      width: 100%;
      max-width: 400px;
      margin-top: 10px;
    }

    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h1>Network Diagnostic Dashboard</h1>

  <!-- Connection Type Display -->
  <div class="card">
    <div class="card-title">Connection Type</div>
    <div class="card-value" id="connection-type">Scanning...</div>
    <div class="sub-text" id="downlink-speed">Estimated Speed: Checking...</div>
  </div>

  <!-- Ping / Latency Display -->
  <div class="card">
    <div class="card-title">Network Latency (Ping)</div>
    <div class="card-value" id="ping-value">Measuring...</div>
    <div class="sub-text" id="ping-status">Quality: Checking...</div>
  </div>

  <!-- Public IP & ISP Information -->
  <div class="card">
    <div class="card-title">Public IP & ISP Details</div>
    <div class="card-value" id="public-ip">Fetching IP...</div>
    <div class="sub-text" id="isp-info">Carrier/ISP: Loading...</div>
    <div class="sub-text" id="location-info">Location: Loading...</div>
  </div>

  <!-- Online/Offline Status Display -->
  <div class="card">
    <div class="card-title">Device Online Status</div>
    <div class="card-value" id="online-status">Checking status...</div>
  </div>

  <!-- Refresh Button -->
  <button onclick="runDiagnostics()">Refresh Network Data</button>

  <script>
    // Master function to run all diagnostic checks
    async function runDiagnostics() {
      checkOnlineStatus();
      checkNetworkInformation();
      await fetchPublicIPDetails();
      await measureLatency();
    }

    // 1. Verify if device is online or offline
    function checkOnlineStatus() {
      const statusElement = document.getElementById("online-status");
      if (navigator.onLine) {
        statusElement.innerText = "Online";
        statusElement.style.color = "#00e676";
      } else {
        statusElement.innerText = "Offline";
        statusElement.style.color = "#ff5252";
      }
    }

    // 2. Fetch connection generation (4G/5G) and estimated downlink speed
    function checkNetworkInformation() {
      const typeElem = document.getElementById("connection-type");
      const speedElem = document.getElementById("downlink-speed");

      // Access browser network API safely
      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

      if (connection) {
        const effectiveType = connection.effectiveType ? connection.effectiveType.toUpperCase() : "Unknown";
        typeElem.innerText = effectiveType;

        const downlink = connection.downlink ? connection.downlink + " Mbps" : "Unavailable";
        speedElem.innerText = "Estimated Speed: " + downlink;
      } else {
        typeElem.innerText = "Connected";
        speedElem.innerText = "Detailed Network API not supported on this browser";
      }
    }

    // 3. Fetch public IP address, ISP/Carrier, and location data
    async function fetchPublicIPDetails() {
      const ipElem = document.getElementById("public-ip");
      const ispElem = document.getElementById("isp-info");
      const locElem = document.getElementById("location-info");

      try {
        const response = await fetch("https://ipapi.co/json/");
        if (!response.ok) throw new Error("Network request failed");
        const data = await response.json();

        ipElem.innerText = data.ip || "Unavailable";
        ispElem.innerText = "Carrier/ISP: " + (data.org || data.asn || "Unknown");
        locElem.innerText = "Location: " + (data.city || "") + ", " + (data.country_name || "");
      } catch (error) {
        ipElem.innerText = "Unable to load IP";
        ispElem.innerText = "Carrier/ISP: Connection error or ad blocker enabled";
        locElem.innerText = "Location: Unavailable";
      }
    }

    // 4. Measure network ping latency in milliseconds
    async function measureLatency() {
      const pingElem = document.getElementById("ping-value");
      const statusElem = document.getElementById("ping-status");

      const startTime = performance.now();
      try {
        await fetch("https://1.1.1.1/favicon.ico", { mode: "no-cors", cache: "no-cache" });
        const endTime = performance.now();
        const latency = Math.round(endTime - startTime);

        pingElem.innerText = latency + " ms";

        if (latency < 100) {
          statusElem.innerText = "Quality: Excellent";
          statusElem.style.color = "#00e676";
        } else if (latency < 300) {
          statusElem.innerText = "Quality: Fair";
          statusElem.style.color = "#ffb300";
        } else {
          statusElem.innerText = "Quality: Poor";
          statusElem.style.color = "#ff5252";
        }
      } catch (error) {
        pingElem.innerText = "Error";
        statusElem.innerText = "Quality: Ping test failed";
      }
    }

    // Run diagnostics automatically when the web page finishes loading
    window.onload = runDiagnostics;
  </script>
</body>
</html>
