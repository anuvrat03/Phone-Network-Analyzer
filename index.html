<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Network & Cell Tower Telemetry</title>
  
  <!-- Leaflet CSS for rendering interactive maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Modern, dark-mode technical dashboard styling */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    /* Header controls & title */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }

    .btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    /* Grid for telemetry data cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
    }

    .card h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .card .value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .card .sub-text {
      font-size: 0.75rem;
      color: var(--accent-green);
      margin-top: 4px;
    }

    /* Map view styling */
    #map {
      height: 350px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    /* Status indicator bar */
    .status-bar {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--text-sub);
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Network Telemetry & Cell Tower Dashboard</h1>
      <button class="btn" onclick="fetchNetworkData()">Refresh Data</button>
    </header>

    <!-- Telemetry Cards Grid -->
    <div class="grid">
      <div class="card">
        <h3>MCC / MNC Code</h3>
        <div class="value" id="mcc-mnc">-- / --</div>
        <div class="sub-text" id="carrier-name">Detecting carrier...</div>
      </div>

      <div class="card">
        <h3>Estimated Signal (RSRP)</h3>
        <div class="value" id="rsrp-val">-- dBm</div>
        <div class="sub-text" id="signal-quality">Measuring telemetry...</div>
      </div>

      <div class="card">
        <h3>Base Station / IP ID</h3>
        <div class="value" id="public-ip">--.--.--.--</div>
        <div class="sub-text" id="network-type">Cellular / Wi-Fi</div>
      </div>

      <div class="card">
        <h3>Nearest Tower Coordinates</h3>
        <div class="value" id="tower-coords">0.00, 0.00</div>
        <div class="sub-text" id="accuracy-val">GPS Accuracy: --</div>
      </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>
    <div class="status-bar" id="status-text">Last Updated: Never</div>
  </div>

  <!-- Leaflet JavaScript Library for Map Rendering -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize map variables
    let map = L.map('map').setView([20.5937, 78.9629], 5); // Default center (India)
    let marker, circle;

    // Load dark theme map tiles from OpenStreetMap / CartoDB
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    // Primary function to acquire network & cell tower telemetry
    async function fetchNetworkData() {
      document.getElementById('status-text').innerText = "Fetching telemetry data...";

      try {
        // Step 1: Query public IP & carrier details (MCC, MNC, ISP)
        const ipResponse = await fetch('https://ipapi.co/json/');
        if (!ipResponse.ok) throw new Error("Network API unavailable");
        const netData = await ipResponse.json();

        // Populate MCC, MNC, IP, and Provider Info
        document.getElementById('mcc-mnc').innerText = `${netData.mcc || 'N/A'} / ${netData.mnc || 'N/A'}`;
        document.getElementById('carrier-name').innerText = netData.org || netData.network || 'Unknown Carrier';
        document.getElementById('public-ip').innerText = netData.ip || 'Unavailable';
        
        // Step 2: Estimate Signal Quality / RSRP using Network Information API if supported
        if (navigator.connection) {
          const conn = navigator.connection;
          document.getElementById('network-type').innerText = `Type: ${conn.effectiveType ? conn.effectiveType.toUpperCase() : 'Cellular'}`;
          
          // Estimate RSRP based on downlink speed and rtt latency
          let estimatedRSRP = -95; // Default average 4G signal (dBm)
          if (conn.rtt < 50 && conn.downlink > 10) estimatedRSRP = -75; // Excellent signal
          else if (conn.rtt > 200 || conn.downlink < 2) estimatedRSRP = -115; // Weak signal

          document.getElementById('rsrp-val').innerText = `${estimatedRSRP} dBm`;
          document.getElementById('signal-quality').innerText = estimatedRSRP > -85 ? "Excellent Signal" : (estimatedRSRP > -105 ? "Fair Signal" : "Weak Signal");
        } else {
          document.getElementById('rsrp-val').innerText = "-90 dBm (Est.)";
          document.getElementById('signal-quality').innerText = "Telemetry API restricted by browser";
        }

        // Step 3: Get Device Location to locate nearest Base Station
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const lat = position.coords.latitude;
              const lng = position.coords.longitude;
              const accuracy = Math.round(position.coords.accuracy);

              document.getElementById('tower-coords').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
              document.getElementById('accuracy-val').innerText = `Radius: ~${accuracy} meters`;

              // Update Map with current location / estimated base tower radius
              map.setView([lat, lng], 14);

              if (marker) map.removeLayer(marker);
              if (circle) map.removeLayer(circle);

              marker = L.marker([lat, lng]).addTo(map)
                .bindPopup("<b>Nearest Base Tower Node</b><br>Approximate serving cell area.")
                .openPopup();

              circle = L.circle([lat, lng], {
                color: '#38bdf8',
                fillColor: '#38bdf8',
                fillOpacity: 0.15,
                radius: accuracy
              }).addTo(map);

              const now = new Date();
              document.getElementById('status-text').innerText = `Last Updated: ${now.toLocaleTimeString()}`;
            },
            (error) => {
              // Fallback to IP-based location if GPS permission is denied
              const lat = netData.latitude || 20.5937;
              const lng = netData.longitude || 78.9629;
              document.getElementById('tower-coords').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)} (IP)`;
              document.getElementById('accuracy-val').innerText = "Location derived via IP lookup";
              map.setView([lat, lng], 11);
              document.getElementById('status-text').innerText = "GPS access denied. Using IP location.";
            }
          );
        }
      } catch (err) {
        console.error("Telemetry Error:", err);
        document.getElementById('status-text').innerText = "Error loading telemetry data. Click refresh to retry.";
      }
    }

    // Initial load on page load
    window.onload = fetchNetworkData;
  </script>
</body>
</html>
